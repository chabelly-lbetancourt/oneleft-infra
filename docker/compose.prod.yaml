# Deployed environments of OneLeft (pre and pro): one AWS Lightsail instance of 2 vCPU and 8 GB with Docker Compose
# (infra#4, infra#5). Caddy is the only entry point (HTTPS from Let's Encrypt): it serves the web and sends /api and
# /share to the gateway and /auth to Keycloak, on the same origin. No other port leaves the instance.
# On the instance: cp .env.prod.example .env (and fill it in), then
#   docker compose -f compose.prod.yaml pull && docker compose -f compose.prod.yaml up -d --wait
# Local test with the same definition: PRODUCCION.md, «Producción en local»
name: oneleft-prod

x-backend: &backend
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT:-8080}/actuator/health/readiness | grep -q UP"]
    interval: 10s
    timeout: 5s
    retries: 30
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-backend-env: &backend-env
  # The tokens carry the public URL as issuer; the keys are downloaded inside the network
  KEYCLOAK_ISSUER: https://${ONELEFT_DOMAIN}/auth/realms/oneleft
  KEYCLOAK_JWKS: http://keycloak:8080/auth/realms/oneleft/protocol/openid-connect/certs
  USERS_URL: http://users:8081
  PLANS_URL: http://plans:8082
  NOTIFICATIONS_URL: http://notifications:8083
  CHAT_URL: http://chat:8084
  SOCIAL_URL: http://social:8085
  REPUTATION_URL: http://reputation:8086
  REDIS_HOST: redis
  # pro never loads the demo data (the seeders run with seed & !pro); pre sets SPRING_PROFILES_ACTIVE=seed
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-pro}
  ONELEFT_LOKI_URL: http://loki:3100/loki/api/v1/push
  # The web (same origin) and the Android app (https://localhost inside the WebView)
  CORS_ALLOWED_ORIGINS: https://${ONELEFT_DOMAIN},https://localhost,capacitor://localhost

x-database: &database
  DB_USER: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}

x-rabbitmq: &rabbitmq
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: ${RABBITMQ_USER}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      ONELEFT_DOMAIN: ${ONELEFT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and their keys: kept between restarts, so Let's Encrypt is not asked again
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    depends_on:
      web:
        condition: service_healthy
      gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  web:
    image: ${ONELEFT_IMAGES:-ghcr.io/chabelly-lbetancourt/oneleft-}web:${ONELEFT_WEB_TAG:-${ONELEFT_IMAGE_TAG:-latest}}
    restart: unless-stopped
    mem_limit: 64m
    # 127.0.0.1, not localhost: BusyBox wget tries ::1 first and nginx only listens on IPv4
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  gateway:
    <<: *backend
    image: ${ONELEFT_IMAGES:-ghcr.io/chabelly-lbetancourt/oneleft-}gateway:${ONELEFT_IMAGE_TAG:-latest}
    environment:
      <<: *backend-env
      # Behind Caddy: the client IP comes from X-Forwarded-For, so the rate limit of anonymous requests is per client
      SERVER_FORWARD_HEADERS_STRATEGY: native
      JAVA_TOOL_OPTIONS: -Xmx288m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError
    mem_limit: 512m
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      users:
        condition: service_healthy
      plans:
        condition: service_healthy
      notifications:
        condition: service_healthy

  users:
    <<: *backend
    image: ${ONELEFT_IMAGES:-ghcr.io/chabelly-lbetancourt/oneleft-}users:${ONELEFT_IMAGE_TAG:-latest}
    environment:
      <<: [*backend-env, *database]
      PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/users
      # Profile photos (HU-020) in the Lightsail bucket: browsers upload them straight with signed links
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-${STORAGE_ENDPOINT}}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_REGION: ${STORAGE_REGION}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_PATH_STYLE: ${STORAGE_PATH_STYLE:-false}
      STORAGE_CREATE_BUCKET: ${STORAGE_CREATE_BUCKET:-false}
      JAVA_TOOL_OPTIONS: -Xmx288m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  plans:
    <<: *backend
    image: ${ONELEFT_IMAGES:-ghcr.io/chabelly-lbetancourt/oneleft-}plans:${ONELEFT_IMAGE_TAG:-latest}
    environment:
      <<: [*backend-env, *database, *rabbitmq]
      PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/plans
      JAVA_TOOL_OPTIONS: -Xmx384m -XX:MaxMetaspaceSize=160m -XX:+ExitOnOutOfMemoryError
    mem_limit: 640m
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  notifications:
    <<: *backend
    image: ${ONELEFT_IMAGES:-ghcr.io/chabelly-lbetancourt/oneleft-}notifications:${ONELEFT_IMAGE_TAG:-latest}
    environment:
      <<: [*backend-env, *database, *rabbitmq]
      PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/notifications
      # Web Push keys (./generate-vapid-keys.sh). Empty: notices only inside the app
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError
    mem_limit: 448m
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  chat:
    <<: *backend
    image: ${ONELEFT_IMAGES:-ghcr.io/chabelly-lbetancourt/oneleft-}chat:${ONELEFT_IMAGE_TAG:-latest}
    environment:
      <<: [*backend-env, *database, *rabbitmq]
      PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/chat
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError
    mem_limit: 448m
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      plans:
        condition: service_healthy

  social:
    <<: *backend
    image: ${ONELEFT_IMAGES:-ghcr.io/chabelly-lbetancourt/oneleft-}social:${ONELEFT_IMAGE_TAG:-latest}
    environment:
      <<: [*backend-env, *database, *rabbitmq]
      PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/social
      JAVA_TOOL_OPTIONS: -Xmx288m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      users:
        condition: service_healthy

  reputation:
    <<: *backend
    image: ${ONELEFT_IMAGES:-ghcr.io/chabelly-lbetancourt/oneleft-}reputation:${ONELEFT_IMAGE_TAG:-latest}
    environment:
      <<: [*backend-env, *database, *rabbitmq]
      PORT: 8086
      DB_URL: jdbc:postgresql://postgres:5432/reputation
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError
    mem_limit: 448m
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    restart: unless-stopped
    # Production mode behind Caddy. The realm (keycloak/oneleft-realm.prod.json) is only imported on the first start
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Served under /auth of the public origin; Caddy ends TLS and passes X-Forwarded-*
      KC_HOSTNAME: https://${ONELEFT_DOMAIN}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx512m
      # Placeholders of oneleft-realm.prod.json
      ONELEFT_DOMAIN: ${ONELEFT_DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Email verification and password reset (HU-067), with Amazon SES
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
    volumes:
      - ./keycloak/oneleft-realm.prod.json:/opt/keycloak/data/import/oneleft-realm.json:ro
      - ./keycloak/themes/oneleft:/opt/keycloak/themes/oneleft:ro
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # No curl in the image: the health endpoint (management port 9000, also under /auth) is checked with bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging: *logging

  postgres:
    image: imresamu/postgis:17-3.5
    restart: unless-stopped
    # Sized for 1 GB: the services keep small connection pools
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=768MB", "-c", "work_mem=8MB",
              "-c", "maintenance_work_mem=64MB", "-c", "max_connections=150"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: oneleft
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 1g
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d oneleft"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Rate limit buckets and the first page of each feed: both can be rebuilt, so the oldest keys go first when full
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *logging

  # Daily copy of PostgreSQL (every database and its roles, pg_dumpall) to the Lightsail object storage
  backup:
    build: ./backup
    image: oneleft/backup:local
    pull_policy: build
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_BUCKET: ${BACKUP_BUCKET}
      BACKUP_ENDPOINT: ${BACKUP_ENDPOINT:-}
      AWS_DEFAULT_REGION: ${BACKUP_REGION}
      AWS_ACCESS_KEY_ID: ${BACKUP_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_SECRET_KEY}
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  # --- Observability (docker compose -f compose.prod.yaml --profile observability up -d) ---
  # Grafana under https://<domain>/grafana with its own login; Prometheus and Loki stay inside the network
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 192m
    logging: *logging

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    profiles: [observability]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
    mem_limit: 192m
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${ONELEFT_DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/oneleft-microservices.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 384m
    depends_on:
      - prometheus
      - loki
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  loki-data:
  grafana-data:
