# Prometheus en desarrollo local: los microservicios se ejecutan en el equipo (IntelliJ o java -jar)
# y se accede a ellos desde el contenedor a través de host.docker.internal.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: oneleft
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels: { service: gateway }
      - targets: ['host.docker.internal:8081']
        labels: { service: users }
      - targets: ['host.docker.internal:8082']
        labels: { service: plans }

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ['keycloak:9000']

  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
