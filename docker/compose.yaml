# Entorno de desarrollo de OneLeft
# Uso: cp .env.example .env && docker compose up -d
name: oneleft

services:
  postgres:
    # Multi-architecture (amd64 and arm64) PostgreSQL image with PostGIS
    image: imresamu/postgis:17-3.5
    container_name: oneleft-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: oneleft
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d oneleft"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    container_name: oneleft-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage of the profile photos (HU-020). Versity S3 Gateway on a volume; S3 or a Lightsail
  # bucket when deployed. The metadata of each object (its type) go to a sidecar folder, so any file system works
  storage:
    image: versity/versitygw:v1.8.0
    container_name: oneleft-storage
    entrypoint:
      - sh
      - -c
      - mkdir -p /data/objects /data/meta && exec versitygw posix --sidecar /data/meta /data/objects
    environment:
      ROOT_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      ROOT_SECRET_KEY: ${STORAGE_SECRET_KEY}
      VGW_HEALTH: /health
      # The web (4200, 4300) and the Android app upload the photos straight with the signed links. Local only:
      # deployed, the bucket only allows the origin of the app
      VGW_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "7070:7070"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7070/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: oneleft-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    container_name: oneleft-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Tokens always carry the public URL as issuer; containers can reach Keycloak
      # through the internal network (keycloak:8180) thanks to the dynamic backchannel
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_PORT: "8180"
      # Google as identity provider (HU-021): oneleft-realm.json reads them as ${GOOGLE_CLIENT_ID} placeholders
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Email verification and password reset (HU-067): oneleft-realm.json reads them as ${SMTP_*} placeholders.
      # By default Mailpit captures every email; production points them to a real SMTP server
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@oneleft.dev}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/oneleft-realm.json:/opt/keycloak/data/import/oneleft-realm.json:ro
      # OneLeft login theme (same identity as the web app)
      - ./keycloak/themes/oneleft:/opt/keycloak/themes/oneleft:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The Keycloak image has no curl: the health endpoint (port 9000) is checked with bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Local SMTP server: captures the emails of Keycloak (HU-067) without sending them. Inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27.0
    container_name: oneleft-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Observabilidad (docker compose --profile observability up -d) ---
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: oneleft-prometheus
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:3.7.8
    container_name: oneleft-loki
    profiles: [observability]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki

  grafana:
    image: grafana/grafana:13.2.2
    container_name: oneleft-grafana
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Local only: read access without login to browse the dashboards
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/oneleft-microservices.json
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  # --- Microservicios (docker compose --profile backend up -d --build) ---
  # Requires oneleft-backend cloned next to oneleft-infra and the JARs built (./mvnw -DskipTests package)
  gateway:
    build: ../../oneleft-backend/gateway
    image: oneleft/gateway:dev
    container_name: oneleft-gateway
    profiles: [backend]
    environment: &backend-env
      KEYCLOAK_ISSUER: http://localhost:8180/realms/oneleft
      KEYCLOAK_JWKS: http://keycloak:8180/realms/oneleft/protocol/openid-connect/certs
      USERS_URL: http://users:8081
      PLANS_URL: http://plans:8082
      NOTIFICATIONS_URL: http://notifications:8083
      # Chat of each plan (HU-008): history and the WebSocket the gateway relays
      CHAT_URL: http://chat:8084
      # Following people (HU-047)
      SOCIAL_URL: http://social:8085
      # Reputation from events (HU-009)
      REPUTATION_URL: http://reputation:8086
      # Rate limiting buckets (gateway)
      REDIS_HOST: redis
      # seed: demo profiles and plans (dev only; pre enables it explicitly, production never)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-observability,seed}
      ONELEFT_LOKI_URL: http://loki:3100/loki/api/v1/push
      # Web origins allowed by the gateway: ng serve (4200), the web container (4300) and the Android app
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:4300,https://localhost,capacitor://localhost
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_started
      keycloak:
        condition: service_healthy
      users:
        condition: service_healthy
      plans:
        condition: service_healthy
      notifications:
        condition: service_healthy
    healthcheck: &backend-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT:-8080}/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  users:
    build: ../../oneleft-backend/users
    image: oneleft/users:dev
    container_name: oneleft-users
    profiles: [backend]
    environment:
      <<: *backend-env
      PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/users
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Profile photos (HU-020): the service calls the storage inside the network, but signs the links for the
      # address browsers reach (the Android emulator too, with adb reverse tcp:7070)
      STORAGE_ENDPOINT: http://storage:7070
      STORAGE_PUBLIC_ENDPOINT: http://localhost:7070
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck: *backend-health

  plans:
    build: ../../oneleft-backend/plans
    image: oneleft/plans:dev
    container_name: oneleft-plans
    profiles: [backend]
    environment:
      <<: *backend-env
      PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/plans
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck: *backend-health

  # Notices of nearby plans (HU-006): listens to plan.published and notifies in the app (through plans) and by Web Push
  notifications:
    build: ../../oneleft-backend/notifications
    image: oneleft/notifications:dev
    container_name: oneleft-notifications
    profiles: [backend]
    environment:
      <<: *backend-env
      PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/notifications
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # Web Push keys (./generate-vapid-keys.sh --write). Empty: notices only inside the app
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck: *backend-health

  # Chat of each plan (HU-008): WebSocket relayed by the gateway; asks plans who is in a plan and hears its departures
  # and cancellations. Not a dependency of the gateway: without the chat, publishing and joining plans still work
  chat:
    build: ../../oneleft-backend/chat
    image: oneleft/chat:dev
    container_name: oneleft-chat
    profiles: [backend]
    environment:
      <<: *backend-env
      PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/chat
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      plans:
        condition: service_healthy
    healthcheck: *backend-health

  # Following people (HU-047): public and private profiles and requests; asks users the name of someone new. Not a
  # dependency of the gateway: without it, plans and the chat still work
  social:
    build: ../../oneleft-backend/social
    image: oneleft/social:dev
    container_name: oneleft-social
    profiles: [backend]
    environment:
      <<: *backend-env
      PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/social
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      users:
        condition: service_healthy
    healthcheck: *backend-health

  # Reputation from events (HU-009): listens to the events of plans (and of the reports, HU-033) in durable queues and
  # keeps an immutable ledger. Not a dependency of the gateway: without it, plans and the chat still work
  reputation:
    build: ../../oneleft-backend/reputation
    image: oneleft/reputation:dev
    container_name: oneleft-reputation
    profiles: [backend]
    environment:
      <<: *backend-env
      PORT: 8086
      DB_URL: jdbc:postgresql://postgres:5432/reputation
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck: *backend-health

  # --- Web app (docker compose --profile frontend up -d --build) ---
  # Requires oneleft-frontend cloned next to oneleft-infra. Builds the image from its Dockerfile with the local
  # configuration (API on localhost:8080, Keycloak on localhost:8180); the PrimeUI licence is read from the frontend
  # .env as a BuildKit secret, so it never ends up in the image
  frontend:
    build:
      context: ../../oneleft-frontend
      args:
        CONFIGURATION: development
      secrets:
        - primeui
    image: oneleft/web:dev
    container_name: oneleft-web
    profiles: [frontend]
    ports:
      - "4300:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  primeui:
    file: ../../oneleft-frontend/.env

volumes:
  postgres-data:
  redis-data:
  storage-data:
  rabbitmq-data:
  prometheus-data:
  loki-data:
  grafana-data:
