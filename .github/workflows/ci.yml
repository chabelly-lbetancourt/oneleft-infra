name: ci

on:
  push:
    # issue#N and hotfix/* branches are validated in their pull request (avoids duplicate runs)
    branches: [main, pre, dev]
  pull_request:
    branches: [dev, pre, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose:
    name: Compose, Caddy, realm and backup
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docker
    steps:
      - uses: actions/checkout@v7

      # The web profile builds from oneleft-frontend, which is not checked out here
      - name: Development Compose
        run: |
          docker compose --env-file .env.example --profile backend --profile observability config --quiet

      - name: Production Compose (and its local test)
        run: |
          docker compose --env-file .env.prod.example -f compose.prod.yaml --profile observability config --quiet
          docker compose --env-file .env.prod.example -f compose.prod.yaml -f compose.prod.local.yaml config --quiet

      - name: Caddyfile
        run: |
          docker run --rm -e ONELEFT_DOMAIN=oneleft.example.com -e ACME_EMAIL=admin@example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Realm of the deployed environments is up to date
        run: python3 keycloak/render-prod-realm.py --check

      - name: Backup script and image
        run: |
          shellcheck backup/backup.sh
          docker build -t oneleft/backup:ci backup
          docker run --rm --entrypoint sh oneleft/backup:ci -c 'pg_dumpall --version && aws --version'
